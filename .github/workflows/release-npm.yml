name: Release npm

# Publishes when a GitHub Release is published (e.g. tag v0.1.1).
# Configure Trusted Publishing on https://www.npmjs.com/package/@esponsor/dni-validator
# → Settings → Trusted Publisher → GitHub Actions
#   Repository: esponsor/dni-validator
#   Workflow: release-npm.yml
# No long-lived NPM_TOKEN is required once Trusted Publishing is set up.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @esponsor/dni-validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/js/package-lock.json

      - name: Install, test, and build
        run: |
          npm --prefix packages/js ci
          npm --prefix packages/js test
          npm --prefix packages/js run build

      - name: Pack dry-run
        run: npm pack --dry-run

      - name: Publish with provenance
        run: npm publish --access public --provenance
