name: Release npm

# Publishes when a GitHub Release is published (e.g. tag v0.1.2).
# Configure Trusted Publishing on https://www.npmjs.com/package/@esponsor/dni-validator
# → Settings → Trusted Publisher → GitHub Actions
#   Repository: esponsor/dni-validator
#   Workflow: release-npm.yml
# No long-lived NPM_TOKEN is required once Trusted Publishing is set up.
#
# Trusted Publishing needs npm >= 11.5.1 and a current Node (22.14+ / 24).
# Release builds intentionally skip dependency caching for a deterministic publish.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @esponsor/dni-validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use npm for Trusted Publishing
        run: npm install --global npm@11.19.0

      - name: Verify tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Package version $VERSION does not match release tag $TAG"
            exit 1
          fi
          echo "Publishing $VERSION (tag $GITHUB_REF_NAME)"

      - name: Install, test, and build
        run: |
          npm --prefix packages/js ci
          npm --prefix packages/js test
          npm --prefix packages/js run build

      - name: Pack dry-run
        run: npm pack --dry-run

      - name: Publish with provenance
        run: npm publish --access public --provenance
